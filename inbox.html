<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox · Thumbnail Board</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="app-config.js"></script>
<script src="api-client.js"></script>
<script src="board-utils.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#171e25; --surface2:#1e252c; --surface3:#272e35;
    --border:rgba(204,218,231,0.08); --border-h:rgba(204,218,231,0.18);
    --text:#ccdae7; --bright:#fff; --muted:#6e7d8c;
    --mint:#3aecba; --purple:#524add; --red:#e94560; --amber:#f5a524;
    --grad:linear-gradient(135deg,#3aecba 0%,#524add 100%);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; -webkit-font-smoothing:antialiased; position:relative;
  }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(204,218,231,0.12); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(204,218,231,0.22); }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(58,236,186,0.12), transparent 55%),
      radial-gradient(ellipse 900px 600px at 85% 8%, rgba(82,74,221,0.14), transparent 55%);
  }
  body > * { position:relative; z-index:1; }
  a { color:inherit; text-decoration:none; }

  header {
    position:sticky; top:0; z-index:50;
    background:rgba(13,17,23,0.92); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:16px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .logo { font-weight:800; font-size:14px; letter-spacing:1.8px; color:var(--bright); }
  .logo span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .back-link {
    font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.5px;
    text-transform:uppercase; padding:6px 10px; border-radius:8px;
    transition:color .15s, background .15s;
  }
  .back-link:hover { color:var(--text); background:var(--surface2); }
  .stats { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
  .spacer { flex:1; }

  .tabs { display:inline-flex; gap:2px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:3px; }
  .tab {
    display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px;
    border:none; border-radius:7px; background:transparent; color:var(--muted);
    font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s;
  }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--surface3); color:var(--bright); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .tab-count { color:var(--muted); font-variant-numeric:tabular-nums; }
  .tab[hidden] { display:none; }
  .hint { font-size:12px; color:var(--muted); }
  .select {
    height:36px; padding:0 30px 0 12px; border-radius:10px; appearance:none; -webkit-appearance:none;
    background:var(--surface2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236e7d8c' stroke-width='3' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 11px center;
    color:var(--text); border:1px solid var(--border);
    font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; outline:none;
  }
  .select:hover, .select:focus-visible { border-color:var(--border-h); color:var(--bright); }
  .menu-wrap { position:relative; }
  .icon-btn {
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
    color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn svg { width:16px; height:16px; }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { color:var(--bright); border-color:var(--border-h); }
  .menu {
    position:absolute; top:calc(100% + 6px); right:0; min-width:230px; z-index:120;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px;
    box-shadow:0 14px 36px rgba(0,0,0,.55);
    opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .12s, transform .12s;
  }
  .menu.show { opacity:1; transform:none; pointer-events:auto; }
  .menu button, .menu label {
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; border:none;
    color:var(--text); font-family:inherit; font-size:12px; font-weight:600; padding:8px 10px; border-radius:7px; cursor:pointer;
  }
  .menu button:hover, .menu label:hover { background:var(--surface3); color:var(--bright); }
  .menu button:disabled { opacity:.5; cursor:wait; }
  .menu hr { border:none; border-top:1px solid var(--border); margin:5px 2px; }
  .menu input[type=checkbox] { accent-color:var(--mint); }
  .menu-field { justify-content:space-between; }
  .menu-field select { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; font:inherit; padding:3px 6px; }
  /* Appears only when something is selected; one clear action */
  .action-bar {
    position:fixed; left:50%; bottom:24px; z-index:150;
    display:flex; align-items:center; gap:10px; padding:8px 8px 8px 18px;
    background:rgba(23,30,37,.94); backdrop-filter:blur(14px);
    border:1px solid var(--border-h); border-radius:14px; box-shadow:0 16px 40px rgba(0,0,0,.55);
    font-size:13px; color:var(--text); white-space:nowrap;
    transform:translate(-50%, 16px); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  }
  .action-bar.show { transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
  .action-bar b.keep { color:var(--mint); }
  .action-bar b.reject { color:var(--red); }
  .bar-btn {
    height:34px; padding:0 14px; border-radius:9px; border:1px solid var(--border); background:transparent;
    color:var(--text); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
  }
  .bar-btn:hover { color:var(--bright); border-color:var(--border-h); }
  .bar-btn.primary { background:var(--bright); color:#0d1117; border-color:transparent; }
  .bar-btn.primary:hover { background:#dfe9f2; }
  .bar-btn:disabled { opacity:.5; cursor:wait; }
  .bar-btn[hidden] { display:none; }
  body.waiting-view .card { cursor:default; }
  body.waiting-view .card:hover { transform:none; }
  @media (max-width:760px) { .hint { display:none; } header { padding:12px 16px; } }

  main { max-width:1600px; margin:0 auto; padding:24px clamp(20px, 4vw, 48px) 100px; }

  #grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:20px 16px;
  }
  .card {
    background:transparent; border-radius:12px;
    cursor:pointer; transition:transform .15s;
    display:flex; flex-direction:column;
    outline:2px solid transparent; outline-offset:3px; border-radius:14px;
  }
  .card:hover { transform:translateY(-2px); }
  .card.kept { outline-color:var(--mint); }
  .card.rejected { outline-color:rgba(233,69,96,.6); }

  /* Thumbnail (16:9 image with small overlay controls) */
  .thumb {
    position:relative; aspect-ratio:16/9;
    background:var(--surface); border-radius:12px; overflow:hidden;
    transition:box-shadow .15s;
  }
  .card:hover .thumb { box-shadow:0 14px 30px rgba(0,0,0,.5); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:filter .15s, opacity .15s; }
  .card.rejected .thumb img { filter:grayscale(.8) brightness(.5); }

  /* Info row under the thumbnail — YouTube-style: title, then channel · views · age, with score on the right */
  .info {
    display:flex; gap:10px; align-items:flex-start;
    padding:10px 4px 2px;
  }
  .info-left { flex:1; min-width:0; }
  .card .title {
    color:var(--bright); font-size:13px; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    margin-bottom:5px;
    word-break:break-word;
  }
  .card .sub {
    color:var(--muted); font-size:12px; font-weight:500; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:5px; min-width:0;
  }
  .card .sub > * { flex-shrink:0; }
  .card .sub .channel-name { overflow:hidden; text-overflow:ellipsis; min-width:0; flex-shrink:1; }
  .card .sub .dot { opacity:.45; }

  /* Block-channel button — inline next to the channel name, appears on card hover */
  .block-channel-btn {
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:none; padding:2px;
    color:var(--muted); cursor:pointer;
    opacity:0; transition:opacity .15s, color .15s, background .15s;
    border-radius:5px;
  }
  .card:hover .block-channel-btn { opacity:.55; }
  .block-channel-btn:hover { opacity:1 !important; color:var(--red); background:rgba(233,69,96,0.10); }
  .block-channel-btn svg { width:13px; height:13px; }

  /* Outlier badge — VidIQ palette, 3 tiers.
     score-1 = 1.5-5   moderate    (blue)
     score-2 = 5-10    strong      (purple)
     score-3 = 10+     exceptional (red) */
  .score-badge {
    flex-shrink:0;
    padding:4px 9px; border-radius:8px;
    font-size:12px; font-weight:800; letter-spacing:.3px;
    display:inline-flex; align-items:center; gap:3px;
    line-height:1;
    color:#fff;
  }
  .score-badge.score-1 { background:#007dfa; }
  .score-badge.score-2 { background:#5b3dec; }
  .score-badge.score-3 { background:#a20039; }
  .score-badge .x { font-size:9px; opacity:.7; font-weight:700; }

  /* Keep checkmark — top-left of the thumb (mirrors the reject mark spot) */
  .keep-tick {
    position:absolute; top:8px; left:8px;
    width:28px; height:28px; border-radius:50%;
    background:var(--mint); border:2px solid var(--mint);
    display:none; align-items:center; justify-content:center;
    z-index:2;
  }
  .keep-tick::after {
    content:''; width:14px; height:14px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d1117' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
  }
  .card.kept .keep-tick { display:flex; }

  /* Rejected mark — visual-only badge in the top-left when card is rejected.
     The actual reject action is bound to right-click on the whole card. */
  .reject-mark {
    position:absolute; top:8px; left:8px;
    width:26px; height:26px; border-radius:50%;
    background:var(--red); border:2px solid var(--red);
    display:none; align-items:center; justify-content:center;
    pointer-events:none; z-index:2;
  }
  .reject-mark::after {
    content:''; width:12px; height:12px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M18 6 6 18'/><path d='m6 6 12 12'/></svg>") center/contain no-repeat;
  }
  .card.rejected .reject-mark { display:flex; }

  /* External-link to YouTube */
  .yt-link {
    position:absolute; bottom:8px; left:8px;
    width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,.75); border:2px solid rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:all .15s; z-index:2;
  }
  .card:hover .yt-link { opacity:1; }
  .yt-link:hover { background:#ff0000; border-color:#ff0000; }
  .yt-link svg { color:#fff; width:13px; height:13px; }

  #empty {
    text-align:center; padding:120px 24px; color:var(--muted);
  }
  #empty h2 { font-size:24px; color:var(--bright); margin-bottom:8px; font-weight:800; letter-spacing:-0.5px; }
  #empty p { font-size:14px; line-height:1.6; }
  #empty button { margin-top:24px; }

  /* Matrix rain — fires only when the user clicks "Run scraper now"
     with an empty inbox. Subtle by design: binary chars, fade-down mask
     so the bottom of the screen stays clean. */
  .matrix-canvas {
    position:fixed !important;
    inset:0;
    z-index:0 !important;
    pointer-events:none;
    opacity:0;
    transition:opacity .9s ease;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 100%);
  }
  .matrix-canvas.active { opacity:0.38; }
  @media (prefers-reduced-motion: reduce) { .matrix-canvas { display:none; } }

  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--surface); color:var(--bright); padding:11px 20px; border-radius:10px;
    font-size:13px; font-weight:600; border:1px solid var(--border);
    opacity:0; transition:all .25s; pointer-events:none;
    box-shadow:0 12px 32px rgba(0,0,0,.4); z-index:200; max-width:540px;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Confirm modal for "Add to board now" (skips auto-tag) */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(13,17,23,0.84); backdrop-filter:blur(16px);
    z-index:300; display:none; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:28px; max-width:480px; width:100%;
    box-shadow:0 24px 64px rgba(0,0,0,0.6);
  }
  .modal h3 { color:var(--bright); font-size:18px; font-weight:800; margin-bottom:10px; letter-spacing:-.3px; }
  .modal p { font-size:13px; line-height:1.6; color:var(--muted); margin-bottom:22px; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>

<canvas id="matrixCanvas" class="matrix-canvas"></canvas>

<header>
  <div class="logo">TB<span>INBOX</span></div>
  <a class="back-link" href="index.html">← Board</a>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tabCandidates" role="tab" aria-selected="true" onclick="setView('candidates')">Candidates <span class="tab-count" id="countCandidates"></span></button>
    <button class="tab" id="tabWaiting" role="tab" aria-selected="false" onclick="setView('waiting')" hidden>Waiting for tags <span class="tab-count" id="countWaiting"></span></button>
  </div>
  <div class="spacer"></div>
  <span class="hint" id="hint">Pick the ones you like · the rest are discarded</span>
  <select class="select" id="sortSel" onchange="setSort(this.value)" aria-label="Sort">
    <option value="score">Outlier score</option>
    <option value="visual">Visual quality (AI)</option>
    <option value="recent">Recent</option>
    <option value="views">Views</option>
  </select>
  <div class="menu-wrap">
    <button class="icon-btn" id="menuBtn" onclick="toggleMenu(event)" aria-label="More options" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <div class="menu" id="menu" onclick="event.stopPropagation()">
      <label class="menu-field">Collector min. outlier
        <select id="minScoreSel">
          <option value="">default</option>
          <option value="1.2">1.2</option>
          <option value="1.5">1.5</option>
          <option value="2.0">2</option>
          <option value="3.0">3</option>
          <option value="5.0">5</option>
        </select>
      </label>
      <button id="runBtn" onclick="closeMenu(); runScrape()">Run collector now</button>
    </div>
  </div>
</header>

<div class="action-bar" id="actionBar" aria-live="polite">
  <span id="actionSummary"></span>
  <button class="bar-btn" id="clearBtn" onclick="clearAll()">Clear</button>
  <button class="bar-btn primary" id="processBtn" onclick="doProcess()">Apply</button>
</div>

<main>
  <div id="grid"></div>
  <div id="empty" style="display:none">
    <h2>Inbox empty</h2>
    <p>The scraper bot will fill this up on its next run.<br>You can also trigger it manually now.</p>
    <button class="bar-btn primary" onclick="runScrape()">Run collector now</button>
  </div>
</main>

<div id="toast"></div>


<script>
let items = [];                        // raw inbox items
let waiting = [];                      // approved earlier, still in the tagging queue (status pending)
let view = 'candidates';
const decisions = new Map();           // id → "keep" | "reject"
let sortMode = 'score';

function esc(s) {
  return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]);
}

function scoreClass(it) {
  const s = it.outlierScore || 0;
  if (s >= 10) return 'score-3';
  if (s >= 5)  return 'score-2';
  return 'score-1';
}

function ageLabel(days) {
  if (days == null) return '';
  if (days < 1)   return 'today';
  if (days < 2)   return '1d';
  if (days < 30)  return Math.floor(days) + 'd';
  if (days < 365) return Math.floor(days / 30) + 'mo';
  return Math.floor(days / 365) + 'y';
}

async function load() {
  try {
    const r = await TBApi.fetch('/api/inbox');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    items = await r.json();
  } catch (e) {
    items = [];
    toast('Failed to load inbox: ' + e.message, 'error');
  }
  render();
  loadWaiting();
}

// Items approved with the old default went to the Mac tagging queue. Show them
// so they are never invisible, and let the owner publish them untagged.
async function loadWaiting() {
  if (!(TBApi.isLocal || TBApi.getToken())) return;
  try { waiting = await TBApi.request('/api/pending'); } catch { waiting = []; }
  if (!Array.isArray(waiting)) waiting = [];
  if (!waiting.length && view === 'waiting') view = 'candidates';
  render();
}

function setView(next) {
  if (view !== next) decisions.clear();
  view = next;
  render();
}

function toggleMenu(e) {
  e.stopPropagation();
  const open = !document.getElementById('menu').classList.contains('show');
  document.getElementById('menu').classList.toggle('show', open);
  document.getElementById('menuBtn').setAttribute('aria-expanded', String(open));
}
function closeMenu() {
  document.getElementById('menu').classList.remove('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
}
document.addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

async function publishWaiting() {
  const chosen = waiting.filter(v => decisions.get(v.id) === 'keep').map(v => v.id);
  const ids = chosen.length ? chosen : waiting.map(v => v.id);
  if (!chosen.length && !confirm(`Publish all ${ids.length} waiting thumbnails to the board without tags?`)) return;
  if (!ids.length) return;
  const btn = document.getElementById('processBtn');
  btn.disabled = true;
  try {
    const d = await TBApi.request('/api/pending/publish', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
    toast(`Published ${d.moved} on the board`, 'success');
    for (const id of ids) decisions.delete(id);
    await loadWaiting();
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; updateStats(); }
}

function filteredSorted() {
  if (view === 'waiting') return waiting.slice().reverse();   // newest approvals first
  let list = items.slice();
  if (sortMode === 'visual') list.sort((a,b) => (b.visualQuality ?? -1) - (a.visualQuality ?? -1));
  else if (sortMode === 'score') list.sort((a,b) => (b.outlierScore||0) - (a.outlierScore||0));
  else if (sortMode === 'recent') list.sort((a,b) => new Date(b.addedAt||0) - new Date(a.addedAt||0));
  else if (sortMode === 'views') list.sort((a,b) => (b.viewsRaw||0) - (a.viewsRaw||0));
  return list;
}

function render() {
  const list = filteredSorted();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  const waitingView = view === 'waiting';
  document.getElementById('tabCandidates').classList.toggle('active', !waitingView);
  document.getElementById('tabCandidates').setAttribute('aria-selected', String(!waitingView));
  document.getElementById('tabWaiting').classList.toggle('active', waitingView);
  document.getElementById('tabWaiting').setAttribute('aria-selected', String(waitingView));
  document.getElementById('tabWaiting').hidden = !waiting.length;
  document.getElementById('countCandidates').textContent = items.length || '';
  document.getElementById('countWaiting').textContent = waiting.length || '';
  document.body.classList.toggle('waiting-view', waitingView);
  document.getElementById('sortSel').hidden = waitingView;
  if (!list.length) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    updateStats();
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = list.map(it => {
    const state = decisions.get(it.id) || '';
    const cls = state === 'keep' ? 'kept' : state === 'reject' ? 'rejected' : '';
    const scoreLabel = it.outlierScore ? `<span class="x">x</span>${it.outlierScore}` : '—';
    const channel = esc(it.channel || '');
    const channelId = esc(it.channelId || '');
    const views = it.views ? esc(it.views) + ' views' : '';
    const age = ageLabel(it.ageDays);
    return `
      <div class="card ${cls}" data-id="${esc(it.id)}"
           onclick="toggle('${esc(it.id)}')">
        <div class="thumb">
          ${TBBoard.imageMarkup(it,true)}
          <div class="keep-tick"></div>
          <div class="reject-mark"></div>
          <a class="yt-link" href="https://www.youtube.com/watch?v=${esc(it.id)}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()"
             oncontextmenu="event.stopPropagation()"
             aria-label="Open on YouTube">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </a>
        </div>
        <div class="info">
          <div class="info-left">
            <div class="title">${esc(it.title)}</div>
            <div class="sub">
              <span class="channel-name">${channel}</span>
              ${Number.isFinite(it.visualQuality) ? `<span aria-label="AI suggestion · ${Math.round((it.visualConfidence||0)*100)}% confidence · needs review">Visual ${(it.visualQuality+1).toFixed(1)}/5</span>` : ''}
              ${channelId ? `<button class="block-channel-btn" onclick="event.stopPropagation(); blockChannel('${channelId}', items.find(v => v.id === '${esc(it.id)}')?.channel || '')" oncontextmenu="event.stopPropagation()" aria-label="Block channel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>
              </button>` : ''}
              ${views ? `<span class="dot">·</span><span>${views}</span>` : ''}
              ${age   ? `<span class="dot">·</span><span>${age}</span>` : ''}
            </div>
          </div>
          ${it.outlierScore ? `<div class="score-badge ${scoreClass(it)}" aria-label="${esc(it.outlierConfidence)} confidence · baseline ${it.baselineVpd||0} v/d (n=${it.baselineN||0})">
            ${scoreLabel}
          </div>` : ''}
        </div>
      </div>
    `;
  }).join('');
  updateStats();
}

// Select the ones you like; everything else is discarded when you apply.
function toggle(id) {
  if (decisions.get(id) === 'keep') decisions.delete(id);
  else decisions.set(id, 'keep');
  refreshCard(id);
  updateStats();
}

function refreshCard(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  card.classList.remove('kept','rejected');
  const s = decisions.get(id);
  if (s === 'keep')   card.classList.add('kept');
  if (s === 'reject') card.classList.add('rejected');
}
function clearAll()  { decisions.clear(); render(); }

function setSort(v)  { sortMode = v; render(); }

function updateStats() {
  const bar = document.getElementById('actionBar');
  const summary = document.getElementById('actionSummary');
  const processBtn = document.getElementById('processBtn');
  const clearBtn = document.getElementById('clearBtn');
  document.getElementById('hint').textContent = view === 'waiting' ? 'Approved earlier, not yet on the board' : 'Pick the ones you like · the rest are discarded';
  if (view === 'waiting') {
    const chosen = waiting.filter(v => decisions.get(v.id) === 'keep').length;
    summary.textContent = chosen ? `${chosen} selected` : `${waiting.length} waiting for the Mac tagger · click to choose`;
    processBtn.textContent = chosen ? `Publish ${chosen} to board` : 'Publish all to board';
    processBtn.onclick = publishWaiting;
    clearBtn.hidden = !chosen;
    bar.classList.toggle('show', waiting.length > 0);
    return;
  }
  const kept = items.filter(it => decisions.get(it.id) === 'keep').length;
  const rest = items.length - kept;
  summary.innerHTML = kept
    ? `<b class="keep">${kept}</b> to the board · <b class="reject">${rest}</b> discarded`
    : `Nothing selected · <b class="reject">${rest}</b> would be discarded`;
  processBtn.textContent = kept ? `Add ${kept} · discard ${rest}` : `Discard all ${rest}`;
  processBtn.onclick = () => doProcess();
  clearBtn.hidden = !kept;
  bar.classList.toggle('show', items.length > 0);
}


async function doProcess() {
  const destination = 'board';
  // Only candidates shown on this page are decided; new ones collected in the
  // meantime stay in the inbox for next time.
  const keptIds     = items.filter(it => decisions.get(it.id) === 'keep').map(it => it.id);
  const rejectedIds = items.filter(it => decisions.get(it.id) !== 'keep').map(it => it.id);
  if (!items.length) return;
  if (!keptIds.length && !confirm(`Discard all ${rejectedIds.length} candidates?`)) return;

  const btn = document.getElementById('processBtn');
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = 'Saving…';

  const messages = [];
  try {
    if (keptIds.length) {
      const r = await TBApi.fetch('/api/inbox/approve', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ids: keptIds, destination }),
      });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.msg || `Approve failed (HTTP ${r.status})`);
      messages.push(`${d.moved} added to the board`);
    }

    if (rejectedIds.length) {
      const r = await TBApi.fetch('/api/inbox/reject', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ids: rejectedIds }),
      });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.msg || `Reject failed (HTTP ${r.status})`);
      messages.push(`${d.moved ?? d.rejected} discarded`);
    }

    toast(messages.join(' · '), 'success');
    for (const id of keptIds)     decisions.delete(id);
    for (const id of rejectedIds) decisions.delete(id);
    await load();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.textContent = oldLabel;
    btn.disabled = false;
    updateStats();
  }
}

async function blockChannel(channelId, channelName) {
  if (!channelId) { toast('Sin channelId, no se puede bloquear', 'error'); return; }
  const niceName = channelName || channelId;
  if (!confirm(`Bloquear "${niceName}"?\n\nNo volverá a aparecer en el inbox y los items actuales de ese canal se descartan.`)) return;
  try {
    const r = await TBApi.fetch('/api/inbox/block-channel', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ channelId, channelName: niceName }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.msg || `HTTP ${r.status}`);
    toast(`Bloqueado ${niceName}${d.removed ? ` · ${d.removed} items quitados del inbox` : ''}`, 'success');
    await load();
  } catch (e) {
    toast('No pude bloquear: ' + e.message, 'error');
  }
}

/** Returns "Xh Ym" until the next midnight in America/Los_Angeles (when
 *  the YouTube Data API daily quota resets). Handles DST automatically
 *  via Intl.DateTimeFormat — no offset math needed. */
function timeUntilPTMidnight() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Los_Angeles',
    hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false,
  }).formatToParts(new Date());
  const hh = parseInt(parts.find(p => p.type === 'hour').value, 10);
  const mm = parseInt(parts.find(p => p.type === 'minute').value, 10);
  const ss = parseInt(parts.find(p => p.type === 'second').value, 10);
  let secsLeft = (24 - hh) * 3600 - mm * 60 - ss;
  if (secsLeft <= 0) secsLeft += 86400;
  // Round up the last partial minute so we never display the misleading "0m"
  if (secsLeft < 60) return '< 1m · retry shortly';
  const h = Math.floor(secsLeft / 3600);
  const m = Math.ceil((secsLeft % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

async function runScrape() {
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = 'Scraping…';

  // Easter egg: matrix rain when starting from an empty inbox
  const wasEmpty = items.length === 0;
  if (wasEmpty) startMatrixRain();

  // Optional threshold override picked from the dropdown
  const minScore = document.getElementById('minScoreSel').value;
  const payload = minScore ? { min_outlier_score: parseFloat(minScore) } : {};
  try {
    const r = await TBApi.fetch('/api/scrape/run', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.msg || `HTTP ${r.status}`);
    const s = d.stats || {};
    // Detect "all YouTube calls failed with quota exceeded" so the toast tells
    // the user what's actually wrong instead of generic "0 new candidates".
    const errs = s.errors || [];
    const quotaHits = errs.filter(e => /quota|403/i.test(e)).length;
    if (s.discovered === 0 && quotaHits >= 5) {
      toast(`YouTube API quota exceeded — resets in ${timeUntilPTMidnight()}`, 'error');
    } else if (d.msg) {
      toast(d.msg, 'success');
    } else {
      toast(`Scrape done · +${d.added} new · seen ${s.discovered||0} → filtered ${s.after_filters||0} → outlier ${s.after_outlier||0}`, 'success');
    }
    await load();
  } catch (e) {
    toast('Scrape failed: ' + e.message, 'error');
  } finally {
    if (wasEmpty) stopMatrixRain();
    btn.textContent = oldLabel;
    btn.disabled = false;
  }
}

// ── Matrix rain animation ────────────────────────────────────────────
// Canvas-based, mint-coloured (board palette, not classic green) digital
// rain. Only runs while a scrape is in flight from an empty inbox.
let _matrixCleanup = null;
function startMatrixRain() {
  if (_matrixCleanup) return;  // already running
  const canvas = document.getElementById('matrixCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const resize = () => {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  };
  resize();
  window.addEventListener('resize', resize);
  canvas.classList.add('active');

  const fontSize = 14;
  // Sparse streams instead of one-per-column: only ~20% of columns get a
  // stream, capped at 20 total. Each stream has its own slow cadence
  // (2-6 frames between character drops) so the rain feels organic.
  let streams = [];
  const setupStreams = () => {
    const cols = Math.ceil(canvas.width / fontSize);
    const target = Math.max(6, Math.min(20, Math.floor(cols * 0.20)));
    const picked = new Set();
    while (picked.size < target) picked.add(Math.floor(Math.random() * cols));
    streams = [...picked].map(col => ({
      col,
      y:       Math.floor(Math.random() * (canvas.height / fontSize)),
      speed:   2 + Math.floor(Math.random() * 5),   // frames per step
      counter: Math.floor(Math.random() * 5),       // stagger initial offset
    }));
  };
  setupStreams();

  // Re-pick streams on resize so the density stays consistent
  const onResize = () => { resize(); setupStreams(); };
  window.removeEventListener('resize', resize);
  window.addEventListener('resize', onResize);

  let raf;
  const draw = () => {
    // Lighter bg fade than before — trails persist longer = smoother motion
    ctx.fillStyle = 'rgba(13,17,23,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = `${fontSize}px monospace`;
    ctx.fillStyle = 'rgba(58,236,186,0.55)';

    for (const s of streams) {
      s.counter++;
      if (s.counter < s.speed) continue;
      s.counter = 0;

      const ch = Math.random() < 0.5 ? '0' : '1';
      const x = s.col * fontSize;
      const y = s.y * fontSize;
      ctx.fillText(ch, x, y);

      if (y > canvas.height && Math.random() > 0.975) s.y = 0;
      else s.y++;
    }
    raf = requestAnimationFrame(draw);
  };
  draw();

  _matrixCleanup = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
    canvas.classList.remove('active');
    // wait for the opacity fade-out before wiping the canvas
    setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 850);
  };
}
function stopMatrixRain() {
  if (_matrixCleanup) { _matrixCleanup(); _matrixCleanup = null; }
}


function toast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = type==='error' ? '#e94560' : type==='success' ? '#3aecba' : '#fff';
  t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 3500);
}


load();
</script>
